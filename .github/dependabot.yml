# Dependabot: weekly update pull requests; each one runs CI before it can be merged.
# Also turn on "Dependabot alerts" and "Dependabot security updates" in Settings -> Code security.
version: 2
updates:
  - package-ecosystem: pip                 # requirements.in / requirements.txt (pip-compile)
    directory: "/"
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      web: {patterns: ["fastapi", "starlette", "uvicorn", "pydantic*", "httpx", "httpcore"]}
    labels: [dependencies]
  - package-ecosystem: github-actions      # SHA-pinned actions in .github/workflows
    directory: "/"
    schedule: {interval: weekly, day: monday}
    groups:
      actions: {patterns: ["*"]}           # one pull request for all action updates
    labels: [dependencies, ci]
  - package-ecosystem: docker
    directory: "/"
    schedule: {interval: weekly, day: monday}
    labels: [dependencies]
