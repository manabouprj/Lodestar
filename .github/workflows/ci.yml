name: ci
# Actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
on:
  push: {branches: [main], tags: ["v*"]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: {matrix: {python: ["3.11", "3.12"]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check lodestar tests
      - run: pytest -q
      - run: python -m lodestar validate
      - run: python -m lodestar doctor
      - run: python -m lodestar demo --as-of 2026-10-01T02:00:00
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: matrix.python == '3.12'
        with: {name: demo-dashboard-and-reports, path: "dist/\nreports/"}
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - run: docker build -t lodestar:ci .
      - name: smoke test container
        run: |
          docker run -d --name l -p 8080:8080 lodestar:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 2; done
          docker exec l python -m lodestar validate
