# Publishes the DEMO dashboard and sample reports (fictional data only) to GitHub Pages.
# Enable once: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Never point this workflow at a live configuration: it always runs `lodestar demo`.
name: demo-dashboard
on:
  push:
    branches: [main]
    paths: ["lodestar/**", "config/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4.4.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065      # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Build demo site
        run: |
          python -m lodestar demo --out site/index.html
          cp -r reports site/reports
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e      # v4.0.5
