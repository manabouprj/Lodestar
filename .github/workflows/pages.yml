# Publishes the DEMO dashboard and sample reports (fictional data only) to GitHub Pages.
# Enable once: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Never point this workflow at a live configuration: it always runs `lodestar demo`.
name: demo-dashboard
on:
  push:
    branches: [main]
    paths: ["lodestar/**", "config/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Build demo site
        run: |
          python -m lodestar demo --out site/index.html
          cp -r reports site/reports
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
