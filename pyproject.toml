[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lodestar-security"
version = "1.2.0"
description = "LODESTAR - multi-agent security posture intelligence and prioritisation for CISOs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.29", "pydantic>=2.6,<3", "pyyaml>=6.0",
                "jinja2>=3.1", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
lodestar = "lodestar.cli:main"

[tool.setuptools.packages.find]
include = ["lodestar*"]

[tool.setuptools.package-data]
lodestar = ["web/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "E702", "B008", "E501"]
