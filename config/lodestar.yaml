# ---------------------------------------------------------------------------
# LODESTAR platform configuration
# Secrets: NEVER put literal secrets here - use ${ENV_VAR} references.
# ---------------------------------------------------------------------------
org:
  name: Your Organisation
  vertical: banking            # aviation | banking | fintech | retail | energy | power_utilities | telecom | logistics_ports
  timezone: Asia/Dubai

mode: demo                     # demo = synthetic data via mock adapters | live = real connectors
deployment_phase: 4            # 0..4 - agents above this phase are not run (see docs/DEPLOYMENT_PHASES.md)

demo:
  dataset: data/demo/banking.json

storage:
  sqlite_path: data/lodestar.db

assets:
  path: config/assets.example.csv   # CMDB / crown-jewel export (merged with demo assets in demo mode)

reporting:
  output_dir: reports

scoring:                        # weights must sum to 1.0
  w_severity: 0.30
  w_exploit: 0.25
  w_asset: 0.20
  w_exposure: 0.15
  w_time: 0.10
  today: 75
  week: 55
  month: 35
  vertical_weight_strength: 0.6   # how strongly industry weights shift scores (0-1)
  today_capacity: 25              # max non-urgent items on the Today list (attack paths/KEV/active exploitation always shown)

threat_intel:
  live: false                   # true = refresh CISA KEV + FIRST EPSS daily (needs egress to cisa.gov / api.first.org)
  cache_dir: data/intel

llm:
  provider: none                # none | anthropic  (needs ANTHROPIC_API_KEY env)
  model: claude-sonnet-4-5
  max_tokens: 400

itsm:
  provider: none                # none | servicenow | jira
  dry_run: true                 # drafts only - human approval required in the dashboard/API
  base_url: ${ITSM_BASE_URL:-}
  username: ${ITSM_USERNAME:-}
  api_token: ${ITSM_API_TOKEN:-}
  project_key: SEC              # jira project / servicenow assignment group prefix

# Slack / Microsoft Teams: chat with the prioritisation agent and receive the focus brief.
# Agents only inform and prepare; decisions are recorded by mapped roles and audit-logged.
chatops:
  dashboard_url: ${LODESTAR_PUBLIC_URL:-http://127.0.0.1:8080}
  daily_brief_hour: 7            # local time; scheduler posts "what needs attention now"
  alert_on_new_now_decisions: true
  slack:
    enabled: false
    bot_token: ${SLACK_BOT_TOKEN:-}            # chat:write, commands, app_mentions:read, im:history
    signing_secret: ${SLACK_SIGNING_SECRET:-}
    webhook_url: ${SLACK_WEBHOOK_URL:-}        # alternative: post-only incoming webhook
    channel: "#security-leadership"
    user_roles: {}                             # {U0123ABCD: ciso, U0456EFGH: analyst}
    team_channels: {}                          # {"Identity & Access": "#iam-team"}
  teams:
    enabled: false
    workflow_url: ${TEAMS_WORKFLOW_URL:-}      # Teams Workflows "post to channel when a webhook request is received"
    outgoing_webhook_token: ${TEAMS_OUTGOING_WEBHOOK_TOKEN:-}
    user_roles: {}                             # {"<entra-object-id>": ciso}

# One entry per control domain. adapter: mock | file_drop | webhook | ms_graph_security | entra_identity_protection | tenable_vm
connectors:
  # ---- Phase 1 --------------------------------------------------------------
  edr:      {enabled: true, adapter: ms_graph_security, product: Microsoft Defender for Endpoint,
             settings: {tenant_id: "${AZ_TENANT_ID:-}", client_id: "${AZ_CLIENT_ID:-}", client_secret: "${AZ_CLIENT_SECRET:-}", coverage_pct: 0}}
  vmdr:     {enabled: true, adapter: tenable_vm, product: Tenable Vulnerability Management,
             settings: {access_key: "${TENABLE_ACCESS_KEY:-}", secret_key: "${TENABLE_SECRET_KEY:-}"}}
  identity: {enabled: true, adapter: entra_identity_protection, product: Microsoft Entra ID,
             settings: {tenant_id: "${AZ_TENANT_ID:-}", client_id: "${AZ_CLIENT_ID:-}", client_secret: "${AZ_CLIENT_SECRET:-}"}}
  soc:      {enabled: true, adapter: ms_graph_security, product: Microsoft Sentinel,
             settings: {tenant_id: "${AZ_TENANT_ID:-}", client_id: "${AZ_CLIENT_ID:-}", client_secret: "${AZ_CLIENT_SECRET:-}"}}
  email:    {enabled: true, adapter: ms_graph_security, product: Microsoft Defender for Office 365,
             settings: {tenant_id: "${AZ_TENANT_ID:-}", client_id: "${AZ_CLIENT_ID:-}", client_secret: "${AZ_CLIENT_SECRET:-}"}}
  # External intelligence: national CERT / ISAC / vendor PSIRT feeds and advisory e-mails (several sources, one agent)
  threat_intel:
    enabled: true
    product: CERT / ISAC / PSIRT intelligence
    sources:
      - {adapter: taxii, product: National CERT TAXII, settings: {api_root: "${CERT_TAXII_API_ROOT:-}", collection_id: "${CERT_TAXII_COLLECTION:-}", api_token: "${CERT_TAXII_TOKEN:-}", lookback_days: 7}}
      - {adapter: misp, product: Sector ISAC MISP, settings: {base_url: "${ISAC_MISP_URL:-}", api_key: "${ISAC_MISP_KEY:-}", lookback: 7d}}
      - {adapter: csaf, product: CISA ICS advisories (CSAF), settings: {path: data/drop/csaf}}      # or urls: [...]
      - adapter: mailbox
        product: Advisory mailbox
        settings:
          mode: path                       # path (offline .eml) | imap | graph
          path: data/drop/mail
          # imap_host: "${ADVISORY_IMAP_HOST:-}"  imap_user: "${ADVISORY_IMAP_USER:-}"  imap_password: "${ADVISORY_IMAP_PASSWORD:-}"
          # tenant_id / client_id / client_secret / mailbox for mode: graph (Mail.Read + ApplicationAccessPolicy)
          require_dkim: true
          senders:
            - {match: "@ncsc.example", kind: advisory, source: National CERT}
            - {match: "@isac.example", kind: advisory, source: Sector ISAC}
            - {match: "psirt@", kind: advisory, source: Vendor PSIRT}
            - {match: "alerts@mssp.example", kind: alert, source: MSSP}
  # ---- Phase 2 --------------------------------------------------------------
  firewall: {enabled: true, adapter: file_drop, product: Palo Alto Networks NGFW,
             settings: {path: data/drop/firewall, finding_type: misconfiguration,
                        field_map: {title: rule_issue, severity: risk, asset_id: device, first_seen: detected}}}
  waf:      {enabled: true, adapter: webhook, product: Cloudflare WAF}
  web_proxy: {enabled: true, adapter: file_drop, product: Zscaler Internet Access, settings: {path: data/drop/web_proxy}}
  ztna:     {enabled: true, adapter: file_drop, product: Zscaler Private Access, settings: {path: data/drop/ztna}}
  pam:      {enabled: true, adapter: file_drop, product: CyberArk PAM, settings: {path: data/drop/pam}}
  cloud:    {enabled: true, adapter: ms_graph_security, product: Microsoft Defender for Cloud,
             settings: {tenant_id: "${AZ_TENANT_ID:-}", client_id: "${AZ_CLIENT_ID:-}", client_secret: "${AZ_CLIENT_SECRET:-}"}}
  fraud:    {enabled: true, adapter: webhook, product: Feedzai}
  bug_bounty:                              # HackerOne pull + signed webhooks (/api/ingest/hackerone) + VDP mailbox
    enabled: true
    product: HackerOne
    sources:
      - {adapter: hackerone, product: HackerOne, settings: {api_identifier: "${H1_API_IDENTIFIER:-}", api_token: "${H1_API_TOKEN:-}", program_handle: "${H1_PROGRAM:-}", response_targets: {first_response_hours: 24, triage_hours: 48, bounty_days: 14}}}
      - {adapter: webhook, product: HackerOne webhooks}
      - {adapter: mailbox, product: security@ VDP mailbox, settings: {mode: path, path: data/drop/vdp-mail, senders: [{match: "@hackerone.com", kind: bug_bounty, source: HackerOne}, {match: "@", kind: bug_bounty, source: VDP}]}}     # fraud engine / case manager pushes alerts + KPIs
  # ---- Phase 3 --------------------------------------------------------------
  sast:     {enabled: true, adapter: webhook, product: Checkmarx One}
  dast:     {enabled: true, adapter: webhook, product: Invicti}
  brand:    {enabled: true, adapter: file_drop, product: Recorded Future, settings: {path: data/drop/brand, finding_type: exposure}}
  ai_security: {enabled: true, adapter: webhook, product: Prompt Security}
  dlp:      {enabled: true, adapter: file_drop, product: Microsoft Purview DLP, settings: {path: data/drop/dlp, finding_type: policy_violation}}
  ot:       {enabled: true, adapter: file_drop, product: Claroty xDome, settings: {path: data/drop/ot}}
  backup:   {enabled: true, adapter: file_drop, product: Rubrik Security Cloud, settings: {path: data/drop/backup}}

security:
  # API keys: env LODESTAR_API_KEYS="ciso:<key>,analyst:<key>,exec:<key>"
  # Webhook HMAC secret: env LODESTAR_WEBHOOK_SECRET
  require_auth: false           # set true for any non-demo deployment (enforced automatically in live mode)
