# ---------------------------------------------------------------------------
# LODESTAR integration catalogue - ready-made connector settings per control domain.
#
# `lodestar init` copies from here into your config; you can also paste a block by hand.
# Each domain offers templates, in the order init prefers them (the SIEM you chose first):
#   sentinel      - one KQL query against the Log Analytics workspace your SIEM already fills (read-only)
#   splunk        - one SPL search against Splunk / Splunk ES (read-only)
#   qradar        - one AQL search, or the open-offense list, from IBM QRadar (read-only)
#   elastic       - ES|QL or Query DSL against Elastic Security, OpenSearch or the Wazuh indexer (read-only)
#   sumologic     - one Sumo Logic search job (read-only)
#   google_secops - one UDM search against Google Security Operations (read-only, preview)
#   native        - a vendor API adapter shipped with LODESTAR
#   file_drop     - a scheduled CSV / JSON export dropped into a folder (works for anything)
# Any other SIEM: the http_json adapter (REST + JSON) or a signed webhook - see docs/SIEM_INTEGRATION.md.
#
# These are STARTING POINTS. Table and column names differ between connectors and vendor versions:
# run `lodestar test-connector <domain>` and adjust the query / field_map until the counts match the
# console. {since} (ISO time), {since_epoch} and {since_ms} make a query incremental (cursor kept per source);
# without them the query must return the complete current set (snapshot).
# ---------------------------------------------------------------------------

edr:
  title: Endpoint detection & response
  sentinel:
    product: Defender for Endpoint / EDR via Sentinel
    query: |
      SecurityAlert
      | where TimeGenerated > datetime({since})
      | where ProductName has_any ("Defender for Endpoint", "Defender Advanced Threat Protection", "CrowdStrike", "SentinelOne")
      | summarize arg_max(TimeGenerated, *) by SystemAlertId
      | project TimeGenerated, SystemAlertId, AlertName, AlertSeverity, CompromisedEntity, Status, Tactics, ProductName
    field_map: {finding_id: SystemAlertId, title: AlertName, severity: AlertSeverity, asset_id: CompromisedEntity,
                status: Status, first_seen: TimeGenerated, last_seen: TimeGenerated}
    evidence_fields: [Tactics, ProductName]
    health_query: |
      DeviceInfo
      | where TimeGenerated > ago(7d)
      | summarize arg_max(TimeGenerated, OnboardingStatus, SensorHealthState) by DeviceId
      | summarize coverage_pct = round(100.0 * countif(OnboardingStatus == "Onboarded") / count(), 1),
                  sensors_stale = countif(SensorHealthState != "Active")
  splunk:
    product: CrowdStrike Falcon via Splunk
    search: |
      index=edr sourcetype="CrowdStrike:Event:Streams:JSON" metadata.eventType=DetectionSummaryEvent _time>{since_epoch}
      | rename event.* as *
      | table _time DetectId DetectName SeverityName ComputerName UserName Tactic
    field_map: {finding_id: DetectId, title: DetectName, severity: SeverityName, asset_id: ComputerName,
                user_id: UserName, first_seen: _time}
  qradar:
    product: EDR detections via QRadar
    aql: |
      SELECT starttime, QIDNAME(qid) AS detection, severity, sourceip, destinationip, username,
             LOGSOURCENAME(logsourceid) AS logsource, CATEGORYNAME(category) AS category
      FROM events
      WHERE starttime > {since_ms} AND severity >= 7
        AND (LOGSOURCETYPENAME(devicetype) ILIKE '%CrowdStrike%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%Defender%'
             OR LOGSOURCETYPENAME(devicetype) ILIKE '%SentinelOne%')
      LAST {lookback_days} DAYS
    field_map: {title: detection, severity: severity, asset_id: sourceip, user_id: username, first_seen: starttime}
    evidence_fields: [logsource, category]
    permission: authorised service token for a role that can search events
  elastic:
    product: Elastic Defend / endpoint alerts in Elastic Security
    index: ".alerts-security.alerts-*"
    dsl: {bool: {filter: [{range: {"@timestamp": {gte: "{since}"}}}, {term: {"event.module": endpoint}}]}}
    field_map: {finding_id: kibana.alert.uuid, title: kibana.alert.rule.name, severity: kibana.alert.severity,
                asset_id: host.name, user_id: user.name, status: kibana.alert.workflow_status, first_seen: "@timestamp"}
    status_map: {acknowledged: in_progress}
  google_secops:
    product: EDR detections via Google SecOps (UDM)
    query: 'metadata.event_type = "PROCESS_LAUNCH" AND (security_result.severity = "HIGH" OR security_result.severity = "CRITICAL")'
    field_map: {finding_id: metadata.id, title: securityResult.summary, severity: securityResult.severity,
                asset_id: principal.hostname, user_id: principal.user.userid, first_seen: metadata.eventTimestamp}
  native:
    adapter: ms_graph_security
    product: Microsoft Defender for Endpoint
    settings: {tenant_id: "${AZ_TENANT_ID}", client_id: "${AZ_CLIENT_ID}", client_secret: "${AZ_CLIENT_SECRET}"}
    permission: Microsoft Graph application permission SecurityAlert.Read.All (admin consent)
  file_drop:
    field_map: {finding_id: alert_id, title: alert_name, severity: severity, asset_id: hostname, user_id: user, first_seen: created}

identity:
  title: Identity & access
  sentinel:
    product: Entra ID Protection via Sentinel
    query: |
      AADRiskyUsers
      | summarize arg_max(TimeGenerated, *) by Id
      | where RiskState in ("atRisk", "confirmedCompromised")
      | extend Title = strcat("Risky user: ", RiskDetail, " (", RiskState, ")")
      | project Id, Title, RiskLevel, UserPrincipalName, RiskLastUpdatedDateTime
    field_map: {finding_id: Id, title: Title, severity: RiskLevel, user_id: UserPrincipalName, first_seen: RiskLastUpdatedDateTime}
    finding_type: exposure
  native:
    adapter: entra_identity_protection
    product: Microsoft Entra ID
    settings: {tenant_id: "${AZ_TENANT_ID}", client_id: "${AZ_CLIENT_ID}", client_secret: "${AZ_CLIENT_SECRET}"}
    permission: IdentityRiskyUser.Read.All, UserAuthenticationMethod.Read.All, AuditLog.Read.All (application, admin consent)
    note: the native adapter also reports MFA registration coverage (the mfa_coverage_pct KRI)
  file_drop:
    field_map: {finding_id: id, title: risk_event, severity: risk_level, user_id: upn, first_seen: detected}

soc:
  title: SIEM / SOC incidents
  sentinel:
    product: Microsoft Sentinel incidents
    query: |
      SecurityIncident
      | summarize arg_max(TimeGenerated, *) by IncidentNumber
      | where Status != "Closed"
      | project IncidentNumber, Title, Severity, Status, CreatedTime, Owner = tostring(Owner.assignedTo)
    field_map: {finding_id: IncidentNumber, title: Title, severity: Severity, status: Status, first_seen: CreatedTime}
    finding_type: incident
    health_query: |
      SecurityIncident
      | where CreatedTime > ago(30d)
      | summarize arg_max(TimeGenerated, *) by IncidentNumber
      | extend detect_h = datetime_diff('minute', CreatedTime, FirstActivityTime) / 60.0
      | summarize mttd_hours = round(avg(detect_h), 1), incidents_open = countif(Status != "Closed")
  splunk:
    product: Splunk Enterprise Security notables
    search: |
      index=notable _time>{since_epoch}
      | eval status_label=coalesce(status_label, "New")
      | table _time event_id rule_name urgency dest user status_label
    field_map: {finding_id: event_id, title: rule_name, severity: urgency, asset_id: dest, user_id: user,
                status: status_label, first_seen: _time}
    finding_type: incident
  qradar:
    product: IBM QRadar offenses
    mode: offenses
    offense_filter: status="OPEN"
    offense_fields: id,description,magnitude,severity,status,offense_source,offense_type,start_time,last_updated_time,assigned_to
    field_map: {finding_id: id, title: description, severity: magnitude, asset_id: offense_source, status: status,
                first_seen: start_time, last_seen: last_updated_time}
    finding_type: incident
    note: magnitude 1-10 maps 9+ critical, 7+ high, 4+ medium; closed offenses drop out of the open list and resolve
  elastic:
    product: Elastic Security alerts (open and acknowledged)
    index: ".alerts-security.alerts-*"
    dsl: {bool: {filter: [{range: {"@timestamp": {gte: "now-{lookback_days}d"}}},
                          {terms: {kibana.alert.workflow_status: [open, acknowledged]}}]}}
    field_map: {finding_id: kibana.alert.uuid, title: kibana.alert.rule.name, severity: kibana.alert.severity,
                asset_id: host.name, user_id: user.name, status: kibana.alert.workflow_status, first_seen: "@timestamp"}
    status_map: {acknowledged: in_progress}
    finding_type: incident
    note: >-
      snapshot - an alert that is closed in Kibana drops out and is resolved here. For Wazuh use index wazuh-alerts-*,
      a dsl range on rule.level (gte 10) and field_map title rule.description, severity rule.level, asset_id agent.name
  sumologic:
    product: Sumo Logic Cloud SIEM signals
    query: '_index=sec_signal | fields name, severity, entity, ruleId, timestamp'
    results: messages
    field_map: {title: name, severity: severity, asset_id: entity, first_seen: timestamp}
    evidence_fields: [ruleId]
    note: Cloud SIEM partitions and field names vary by tenant - confirm in Sumo Logic search first

email:
  title: Email security
  sentinel:
    product: Defender for Office 365 via Sentinel
    query: |
      SecurityAlert
      | where TimeGenerated > datetime({since})
      | where ProductName has "Office 365"
      | summarize arg_max(TimeGenerated, *) by SystemAlertId
      | extend Recipient = tostring(parse_json(Entities)[0].Upn)
      | project TimeGenerated, SystemAlertId, AlertName, AlertSeverity, Recipient, Status
    field_map: {finding_id: SystemAlertId, title: AlertName, severity: AlertSeverity, user_id: Recipient,
                status: Status, first_seen: TimeGenerated}
    health_query: |
      UrlClickEvents
      | where TimeGenerated > ago(30d) and Workload == "Email"
      | summarize clicks = countif(ActionType == "ClickAllowed"), blocked = countif(ActionType == "ClickBlocked")
      | extend user_clicks = clicks
      | project user_clicks, phish_blocked = blocked
  native:
    adapter: ms_graph_security
    product: Microsoft Defender for Office 365
    settings: {tenant_id: "${AZ_TENANT_ID}", client_id: "${AZ_CLIENT_ID}", client_secret: "${AZ_CLIENT_SECRET}"}
    permission: SecurityAlert.Read.All
  note: phishing_click_rate_pct usually comes from the awareness platform - add it under kpis_manual

vmdr:
  title: Vulnerability management
  native:
    adapter: tenable_vm
    product: Tenable Vulnerability Management
    settings: {access_key: "${TENABLE_ACCESS_KEY}", secret_key: "${TENABLE_SECRET_KEY}", severities: [critical, high]}
    permission: API keys of a Basic user with Can View on the relevant asset groups
  file_drop:
    product: Qualys VMDR (scheduled CSV report)
    field_map: {title: Title, severity: Severity, asset_id: DNS, cve: CVE ID, first_seen: First Detected,
                last_seen: Last Detected, status: Vuln Status, remediation: Solution, ip: IP}
    severity_map: {"5": critical, "4": high, "3": medium, "2": low, "1": info}
    status_map: {active: open, new: open, re-opened: open, fixed: resolved}
    finding_type: vulnerability
    health: {kpis: {}}
    note: Qualys has no "coverage" in the export - set health.coverage_pct from the scan-coverage dashboard, or use kpis_manual

cloud:
  title: Cloud security posture
  sentinel:
    product: Defender for Cloud recommendations via Sentinel
    query: |
      SecurityRecommendation
      | summarize arg_max(TimeGenerated, *) by RecommendationName, AssessedResourceId
      | where RecommendationState == "Unhealthy" and RecommendationSeverity in ("High", "Medium")
      | extend Id = hash_sha256(strcat(RecommendationName, AssessedResourceId))
      | project Id, RecommendationName, RecommendationSeverity, AssessedResourceId, FirstEvaluationDate
    field_map: {finding_id: Id, title: RecommendationName, severity: RecommendationSeverity, asset_id: AssessedResourceId,
                first_seen: FirstEvaluationDate}
    finding_type: misconfiguration
  native:
    adapter: ms_graph_security
    product: Microsoft Defender for Cloud (alerts)
    settings: {tenant_id: "${AZ_TENANT_ID}", client_id: "${AZ_CLIENT_ID}", client_secret: "${AZ_CLIENT_SECRET}"}
  file_drop:
    product: Wiz / Prisma Cloud issues export
    field_map: {finding_id: Issue ID, title: Title, severity: Severity, asset_id: Resource external ID, status: Status,
                first_seen: Created At}
    finding_type: misconfiguration

firewall:
  title: Firewall
  file_drop:
    product: Firewall policy analyser export (Tufin / AlgoSec / Panorama BPA)
    field_map: {title: rule_issue, severity: risk, asset_id: device, first_seen: detected}
    finding_type: misconfiguration
    note: rule hygiene is a posture problem - export from the policy analyser weekly
  sentinel:
    product: NGFW threat events via Sentinel (CEF)
    query: |
      CommonSecurityLog
      | where TimeGenerated > datetime({since})
      | where DeviceVendor in ("Palo Alto Networks", "Fortinet", "Check Point") and LogSeverity in ("8", "9", "10", "High", "Critical")
      | summarize FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Hits = count()
          by DeviceVendor, Activity, SourceIP, DestinationIP, DeviceName
      | extend Id = hash_sha256(strcat(Activity, SourceIP, DestinationIP)), Sev = "high"
    field_map: {finding_id: Id, title: Activity, severity: Sev, asset_id: DestinationIP, first_seen: FirstSeen, last_seen: LastSeen}
    cursor_column: LastSeen
  splunk:
    product: NGFW / IPS threats via Splunk (CIM Intrusion Detection)
    search: |
      search index=* tag=ids tag=attack _time>{since_epoch}
      | stats min(_time) as first_seen max(_time) as last_seen count as hits max(severity) as severity by signature dest
    field_map: {title: signature, severity: severity, asset_id: dest, first_seen: first_seen, last_seen: last_seen}
  qradar:
    product: NGFW threat events via QRadar
    aql: |
      SELECT MIN(starttime) AS first_seen, MAX(starttime) AS last_seen, QIDNAME(qid) AS threat, sourceip, destinationip,
             MAX(severity) AS sev, COUNT(*) AS hits
      FROM events
      WHERE starttime > {since_ms} AND severity >= 8 AND CATEGORYNAME(category) NOT ILIKE '%Firewall Permit%'
      GROUP BY qid, sourceip, destinationip
      LAST {lookback_days} DAYS
    field_map: {title: threat, severity: sev, asset_id: destinationip, first_seen: first_seen, last_seen: last_seen}
    cursor_column: last_seen
  elastic:
    product: NGFW threat events via Elastic (ECS)
    esql: |
      FROM logs-*
      | WHERE @timestamp > "{since}" AND event.category == "intrusion_detection"
      | STATS first_seen = MIN(@timestamp), last_seen = MAX(@timestamp), hits = COUNT(*)
          BY rule.name, destination.ip, observer.vendor
      | LIMIT 5000
    field_map: {title: rule.name, asset_id: destination.ip, first_seen: first_seen, last_seen: last_seen}
    cursor_column: last_seen
    note: there is no severity column - set severity_map or add one with EVAL
  sumologic:
    product: NGFW threat events via Sumo Logic
    query: '_sourceCategory=*firewall* (threat OR intrusion) | count as hits, min(_messagetime) as first_seen, max(_messagetime) as last_seen by threat_name, dest_ip'
    results: records
    field_map: {title: threat_name, asset_id: dest_ip, first_seen: first_seen, last_seen: last_seen}
    note: field names depend on your parsers (FER / auto-parsing) - check them in a Sumo search first

waf:
  title: Web application firewall
  sentinel:
    product: Azure Application Gateway / Front Door WAF via Sentinel
    query: |
      AGWFirewallLogs
      | where TimeGenerated > datetime({since})
      | where Action in ("Matched", "Detected")
      | summarize FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Hits = count() by RuleId, Message, Hostname
      | extend Id = hash_sha256(strcat(RuleId, Hostname)), Sev = iff(Hits > 100, "high", "medium")
    field_map: {finding_id: Id, title: Message, severity: Sev, asset_id: Hostname, first_seen: FirstSeen, last_seen: LastSeen}
    cursor_column: LastSeen
    note: matched-but-not-blocked rules show where the WAF is in detection mode on a live attack
  webhook:
    product: Cloudflare WAF (Workers / Logpush to webhook)

web_proxy:
  title: Secure web gateway
  sentinel:
    product: Zscaler Internet Access via Sentinel (CEF)
    query: |
      CommonSecurityLog
      | where TimeGenerated > datetime({since}) and DeviceVendor == "Zscaler"
      | where DeviceAction in ("Allowed", "allowed") and (Activity has_any ("Malware", "Phishing", "Botnet") or DeviceCustomString5 has_any ("Malware", "Phishing"))
      | summarize FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Hits = count() by SourceUserName, RequestURL, Activity
      | extend Id = hash_sha256(strcat(SourceUserName, RequestURL)), Sev = "high"
    field_map: {finding_id: Id, title: Activity, severity: Sev, user_id: SourceUserName, first_seen: FirstSeen, last_seen: LastSeen}
    evidence_fields: [RequestURL]
    cursor_column: LastSeen
  file_drop:
    field_map: {title: threat_name, severity: risk, user_id: user, asset_id: device, first_seen: time}

pam:
  title: Privileged access
  file_drop:
    product: CyberArk / BeyondTrust / Delinea compliance report
    field_map: {title: EventName, severity: Risk, user_id: TargetUser, asset_id: TargetMachine, first_seen: Timestamp}
    severity_map: {"5": critical, "4": high, "3": medium}
    finding_type: policy_violation
    note: put vaulted_pct and standing_admins in health.kpis (from the PAM dashboard) or kpis_manual

threat_intel:
  title: Threat intelligence feeds
  native:
    sources:
      - {adapter: taxii, product: National CERT TAXII, settings: {api_root: "${CERT_TAXII_API_ROOT}", collection_id: "${CERT_TAXII_COLLECTION}", api_token: "${CERT_TAXII_TOKEN}", lookback_days: 7}}
      - {adapter: misp, product: Sector ISAC MISP, settings: {base_url: "${ISAC_MISP_URL}", api_key: "${ISAC_MISP_KEY}", lookback: 7d}}
      - {adapter: csaf, product: CISA ICS advisories (CSAF), settings: {path: data/drop/csaf}}
      - {adapter: mailbox, product: Advisory mailbox, settings: {mode: path, path: data/drop/mail, require_dkim: true, senders: [{match: "@cert.example", kind: advisory, source: National CERT}]}}

bug_bounty:
  title: Bug bounty / VDP
  native:
    sources:
      - {adapter: hackerone, product: HackerOne, settings: {api_identifier: "${H1_API_IDENTIFIER}", api_token: "${H1_API_TOKEN}", program_handle: "${H1_PROGRAM}"}}
      - {adapter: webhook, product: HackerOne webhooks}

fraud:
  title: Fraud & financial crime
  webhook:
    product: Fraud engine / case manager (Feedzai, Actimize, SAS) pushing alerts + KPIs
    note: push detection_rate_pct, alert_backlog_hours, channel_coverage_pct, confirmed_loss_30d in the health block

ot:
  title: OT / ICS visibility
  file_drop:
    product: Claroty / Nozomi / Dragos alert export
    field_map: {finding_id: alert_id, title: alert_title, severity: severity, asset_id: asset_name, first_seen: detected_at}
    note: put unmanaged_remote_access and ot_assets_visible_pct in health.kpis

# Everything else (sast, dast, brand, ai_security, dlp, backup): file_drop or webhook with a field_map.
_generic:
  file_drop:
    field_map: {finding_id: id, title: title, severity: severity, asset_id: asset, user_id: user, first_seen: first_seen}
  webhook: {}
  http_json:
    product: Any SIEM or tool with a REST/JSON read API (LogRhythm, Exabeam, Securonix, FortiSIEM, InsightIDR ...)
    url: https://siem.example/api/v1/alerts
    params: {status: open, since: "{since}"}
    auth: {type: bearer, token: "${SIEM_API_TOKEN}"}
    records: data
    paginate: {type: next_field, path: links.next}
    field_map: {finding_id: id, title: name, severity: severity, asset_id: host, user_id: user, first_seen: created}
  mcp:
    product: Any security product that ships a remote MCP server (one read-only tool, mapped like http_json)
    url: https://mcp.vendor.example/mcp
    auth: {type: bearer, token: "${VENDOR_MCP_TOKEN}"}
    tool: list_alerts
    arguments: {since: "{since}", status: open, limit: 500}
    records: alerts
    cursor_column: created_at
    field_map: {finding_id: id, title: title, severity: severity, asset_id: hostname, user_id: user, first_seen: created_at}
